name: Deploy JavaRoadmap Lab Pages

on:
  push:
    branches: [main]
    # 站点内容由 web/、stages/ 以及 content build 实际消费的文档共同决定：
    # 根目录 *.md（public-roadmap/progress/plan）与 docs/**（环境搭建、教学协作、
    # javaroadmap_lab 设计文档等 13 篇）都会经 documents.json/public-*.md 进入构建。
    # 注意 GitHub Actions 路径匹配里 '*' 不跨目录，'*.md' 只匹配根级 Markdown；
    # 因此改用 allow-list：凡构建可能消费的目录全部列入。代价是纯报告类文档
    # （如 docs/release、docs/overhaul-*）也会触发一次部署——宁可偶尔多部署，
    # 也不能让站点内容静默停留在旧版本。
    paths:
      - 'web/**'
      - 'stages/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "轻量发布：仅安装构建依赖、构建并部署，跳过 npm test / Playwright / 线上 smoke"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
        shell: bash
    env:
      LAB_ARTIFACT_DIR: test-artifacts/pages-preflight
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install and validate production build
        run: |
          mkdir -p test-artifacts/pages-preflight/logs
          npm ci 2>&1 | tee test-artifacts/pages-preflight/logs/install.log
          # npm run build 自带 TypeScript 类型检查，属于构建必要环节
          npm run build 2>&1 | tee test-artifacts/pages-preflight/logs/build.log
          npm run check:build 2>&1 | tee test-artifacts/pages-preflight/logs/assets.log
      - name: Run preflight unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: |
          npm test 2>&1 | tee test-artifacts/pages-preflight/logs/unit.log
      - name: Chromium core against production preview
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/core.spec.ts 2>&1 | tee test-artifacts/pages-preflight/logs/e2e.log
      - name: Record public deployment identity
        run: |
          node -e "require('node:fs').writeFileSync('dist/deployment.json', JSON.stringify({ commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID }))"
      - name: Keep validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-preflight-${{ github.run_attempt }}
          path: web/test-artifacts/pages-preflight/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload only the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      site_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
        shell: bash
    env:
      LAB_SITE_URL: ${{ needs.deploy.outputs.site_url }}
      LAB_EXPECTED_SHA: ${{ github.sha }}
      LAB_ARTIFACT_DIR: test-artifacts/pages-online
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare browser checks
        run: |
          npm ci
          npm run content
          npx playwright install --with-deps chromium
      - name: Test the actual HTTPS deployment
        run: npm run test:pages
      - name: Keep online report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-online-${{ github.run_attempt }}
          path: web/test-artifacts/pages-online/
          retention-days: 14
          if-no-files-found: warn
