name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-java:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 是 ARM64 运行器；它验证脚本的 macOS 兼容性，
        # 不能替代在自己 Apple Silicon 电脑上的实际运行验证。
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Java course verification
        shell: bash
        run: bash scripts/verify_java.sh
