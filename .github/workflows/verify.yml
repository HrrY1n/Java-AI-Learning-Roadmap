name: verify

on:
  push:
    branches: [main]
  pull_request:
    # Java 回归只受课程源码、验证脚本与工作流自身影响；
    # 文档/网站改动由 web.yml 覆盖，避免文档类 PR 也跑双系统 Maven。
    paths:
      - 'stages/**'
      - 'scripts/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

# 与 web.yml 同型：同一 PR 的连续推送只保留最新一次，防止 2 系统 Maven 并行堆积
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-java:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 是 ARM64 运行器；它验证脚本的 macOS 兼容性，
        # 不能替代在自己 Apple Silicon 电脑上的实际运行验证。
        # 两台学习机均为 JDK 25，CI 只跑该版本；文档声明的最低要求
        # （JDK 17+）以 scripts/README.md 记录的本机验证为准。
        os: [windows-latest, macos-latest]
        java: ['25']
    runs-on: ${{ matrix.os }}
    # verify_java 全量 + 三个 Maven 工程（冷缓存含 Spring Boot 依赖下载）的最坏耗时上限
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          # Stage06 起 Maven 工程由自带 wrapper 构建（自动下载官方 Maven 3.9.9）；
          # 缓存按 pom 指纹复用依赖下载，首次运行仍会完整下载；wrapper 目录缓存 Maven 发行包本身。
          key: m2-${{ matrix.os }}-${{ hashFiles('stages/stage06_backend_foundations/*/pom.xml') }}
          restore-keys: m2-${{ matrix.os }}-
      - name: Run Java course verification
        shell: bash
        run: bash scripts/verify_java.sh
      - name: Run Stage06 backend Maven tests
        shell: bash
        run: bash scripts/verify_stage06.sh
